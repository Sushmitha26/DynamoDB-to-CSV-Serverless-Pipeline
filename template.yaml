AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudFormation template for CS218 Final - JSON to CSV Converter

Parameters:
  StudentId:
    Type: String
    Default: "017721457"

Resources:
  SQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "cs218-final-queue-${StudentId}"
      VisibilityTimeout: 180

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - dynamodb:*
                  - logs:*
                  - sqs:*
                Resource: "*"

  JsonToCsvLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "json-to-csv-${StudentId}"
      Handler: index.handler
      Runtime: python3.9
      CodeUri: json-to-csv-converter/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt SQSQueue.Arn
            BatchSize: 1

  QueuePopulatorLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "queue-populator-${StudentId}"
      Handler: index.handler
      Runtime: python3.9
      CodeUri: queue-populator/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
